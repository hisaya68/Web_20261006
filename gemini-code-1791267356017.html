<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natsumi | 自由行與團體旅遊專業領隊 & 行程規劃師</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            DEFAULT: '#FAF8F5',
                            light: '#FDFCF0',
                            card: '#FFFFFF',
                            border: '#E8E2D8'
                        },
                        amber: {
                            warm: '#C68B59',
                            hover: '#B07848',
                            light: '#F7EFE5'
                        },
                        slate: {
                            dark: '#2B2D42',
                            muted: '#5A6075'
                        }
                    },
                    fontFamily: {
                        serif: ['Baskerville', 'Georgia', 'LiSong Pro', '儷宋', 'serif'],
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #FAF8F5;
            color: #2B2D42;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .serif-title {
            font-family: 'Baskerville', 'Georgia', 'LiSong Pro', '儷宋 Pro', serif;
        }
    </style>
</head>
<body class="antialiased selection:bg-amber-warm selection:text-white">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-cream/90 backdrop-blur-md border-b border-cream-border transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo -->
                <a href="#home" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-amber-warm text-white flex items-center justify-center font-serif text-xl font-bold">N</div>
                    <div>
                        <span class="text-xl font-serif font-bold text-slate-dark tracking-wide block">Natsumi</span>
                        <span class="text-xs text-slate-muted block tracking-wider">資深領隊 & 行程規劃師</span>
                    </div>
                </a>

                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8 items-center font-medium text-sm text-slate-dark">
                    <a href="#about" class="hover:text-amber-warm transition">關於我</a>
                    <a href="#services" class="hover:text-amber-warm transition">諮詢服務</a>
                    <a href="#estimator" class="hover:text-amber-warm transition">服務試算</a>
                    <a href="#cases" class="hover:text-amber-warm transition">服務案例</a>
                    <a href="#blog" class="hover:text-amber-warm transition">專業文章</a>
                    <a href="#contact" class="px-5 py-2.5 rounded-full bg-amber-warm text-white hover:bg-amber-hover transition shadow-sm">預約諮詢</a>
                </div>

                <!-- Mobile Menu Button -->
                <button id="menu-btn" class="md:hidden p-2 text-slate-dark hover:text-amber-warm">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden bg-cream-light border-b border-cream-border px-6 py-4 space-y-4">
            <a href="#about" class="block text-slate-dark hover:text-amber-warm font-medium">關於我</a>
            <a href="#services" class="block text-slate-dark hover:text-amber-warm font-medium">諮詢服務</a>
            <a href="#estimator" class="block text-slate-dark hover:text-amber-warm font-medium">服務試算</a>
            <a href="#cases" class="block text-slate-dark hover:text-amber-warm font-medium">服務案例</a>
            <a href="#blog" class="block text-slate-dark hover:text-amber-warm font-medium">專業文章</a>
            <a href="#contact" class="block w-full text-center px-5 py-2.5 rounded-full bg-amber-warm text-white font-medium">預約諮詢</a>
        </div>
    </nav>

    <!-- 1.0 Hero Section -->
    <section id="home" class="pt-32 pb-20 md:pt-40 md:pb-28 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <div class="grid md:grid-cols-12 gap-12 items-center">
            <div class="md:col-span-7 space-y-6">
                <div class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-full bg-amber-light text-amber-warm text-xs font-semibold tracking-wider uppercase">
                    <i data-lucide="compass" class="w-4 h-4"></i>
                    <span>自在遊旅行社 18年深耕領隊</span>
                </div>
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-serif font-bold text-slate-dark leading-tight">
                    讓每一趟旅程，<br/>
                    都充滿<span class="text-amber-warm italic">自在與安心</span>的記憶。
                </h1>
                <p class="text-slate-muted text-base sm:text-lg leading-relaxed max-w-2xl">
                    一趟真正令人難忘的旅行，不只是抵達目的地，更來自每一個細節都被妥善理解、預先規劃與溫暖照顧。具備國家領隊證照、日檢 N2 與多益 935 分，為您打造量身訂製的質感旅程。
                </p>

                <!-- Key Credentials Badges -->
                <div class="grid grid-cols-3 gap-4 pt-4 border-t border-cream-border">
                    <div class="bg-cream-card p-4 rounded-xl border border-cream-border text-center shadow-sm">
                        <div class="text-2xl sm:text-3xl font-serif font-bold text-amber-warm">18+</div>
                        <div class="text-xs text-slate-muted mt-1">年旅遊產業經驗</div>
                    </div>
                    <div class="bg-cream-card p-4 rounded-xl border border-cream-border text-center shadow-sm">
                        <div class="text-2xl sm:text-3xl font-serif font-bold text-amber-warm">JLPT N2</div>
                        <div class="text-xs text-slate-muted mt-1">日本語能力認證</div>
                    </div>
                    <div class="bg-cream-card p-4 rounded-xl border border-cream-border text-center shadow-sm">
                        <div class="text-2xl sm:text-3xl font-serif font-bold text-amber-warm">935分</div>
                        <div class="text-xs text-slate-muted mt-1">TOEIC 多益金證</div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 pt-4">
                    <a href="#contact" class="inline-flex justify-center items-center px-8 py-3.5 rounded-full bg-amber-warm text-white font-medium hover:bg-amber-hover transition shadow-md group">
                        預約行程諮詢
                        <i data-lucide="arrow-right" class="w-4 h-4 ml-2 group-hover:translate-x-1 transition"></i>
                    </a>
                    <a href="#services" class="inline-flex justify-center items-center px-8 py-3.5 rounded-full bg-cream-card border border-cream-border text-slate-dark font-medium hover:border-amber-warm transition">
                        瀏覽服務項目
                    </a>
                </div>
            </div>

            <div class="md:col-span-5">
                <div class="relative mx-auto max-w-md md:max-w-none">
                    <div class="w-full h-[450px] sm:h-[520px] rounded-2xl bg-gradient-to-br from-amber-warm/20 to-slate-dark/10 p-4 border border-cream-border relative overflow-hidden shadow-xl">
                        <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&q=80&w=800" alt="Natsumi 旅行現場" class="w-full h-full object-cover rounded-xl"/>
                        <div class="absolute bottom-8 left-8 right-8 bg-cream-light/95 backdrop-blur-md p-5 rounded-xl border border-cream-border shadow-lg">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-amber-light flex items-center justify-center text-amber-warm">
                                    <i data-lucide="award" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-slate-dark">國家認證領隊</p>
                                    <p class="text-xs text-slate-muted">熟諳關東、關西、北海道、九州與歐亞跨國路線</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 2.0 About Me Section -->
    <section id="about" class="py-20 bg-cream-light
